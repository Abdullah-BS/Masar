<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>شاشة مسار</title>
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312060C'/%3E%3Cpath fill='%233BE37A' d='M10 26h24V14l22 18-22 18V38H10z'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{display:grid;place-items:center;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:#B9A6AE;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
#bezel{background:#100709;border-radius:2.2vmin;padding:2.4vmin;box-shadow:0 0 0 .35vmin #2A1A22,0 3vmin 8vmin rgba(0,0,0,.6)}
canvas{display:block;border-radius:1vmin;background:#050305}
.hud{position:fixed;top:max(2.2vmin,env(safe-area-inset-top));inset-inline-start:max(2.6vmin,env(safe-area-inset-left));display:flex;align-items:center;gap:1.6vmin;font-size:max(13px,2.4vmin);opacity:.8}
.hud b{font-size:max(16px,3.2vmin);color:#F3ECEF}
.chip{display:inline-flex;align-items:center;gap:.9vmin;border:1px solid #2A1A22;border-radius:99px;padding:.5vmin 1.8vmin}
.chip::before{content:"";width:1.3vmin;height:1.3vmin;min-width:8px;min-height:8px;border-radius:50%;background:currentColor}
.chip[data-s="live"]{color:#4DFF8E}
.chip[data-s="stale"]{color:#FFB020;border-color:#6A4A10}
.chip[data-s="wait"],.chip[data-s="nosuch"]{color:#B9A6AE}
.hint{position:fixed;bottom:max(2.4vmin,env(safe-area-inset-bottom));font-size:max(12px,2.2vmin);opacity:.55;transition:opacity .6s}
.clean .hud,.clean .hint{display:none}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="bezel"><canvas id="cv" role="img" aria-label="Masar guide screen"></canvas></div>
<div class="hud"><b id="sid"></b><span class="chip" id="chip" data-s="wait"></span></div>
<div class="hint" id="hint"></div>
<p class="sr" id="live" aria-live="polite"></p>
<script>
/* Masar screen: one floor screen, mirrored from the control panel.
   Frames arrive from the panel as one text line: M,<seq>,<point>,<mode>,<arrows>,<defaults>
   - arrows / defaults: one letter per screen (U ahead, R right, L left, D back, X closed, O off)
   - this page shows letter number ?s=N. Sources: BroadcastChannel (same computer) and, when this
     page is served by the ESP32, polling its /f endpoint. No frames for 3 s -> default route, amber. */
(() => {
  const q = new URLSearchParams(location.search);
  const ID = Math.max(1, parseInt(q.get('s') || '1', 10) || 1);
  const lang = q.get('lang') === 'en' ? 'en' : 'ar';
  const T = (a, e) => lang === 'ar' ? a : e;
  const TIMEOUT = Math.max(1, Number(q.get('timeout')) || 3) * 1000;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  if (lang === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
  if (q.get('clean') === '1') document.body.classList.add('clean');
  $('sid').textContent = 'S' + ID;
  document.title = T('شاشة مسار · S', 'Masar screen · S') + ID;

  /* ---------- frames in ---------- */
  let got = null;                       // last frame {arrows, defaults, point, mode, at}
  function onFrame(f, at) {
    const p = String(f).trim().split(',');
    if (p[0] !== 'M' || p.length < 5) return;
    got = { seq: +p[1], point: p[2], mode: p[3], arrows: p[4], defaults: p[5] || '', at: at == null ? performance.now() : at };
    update();
  }
  let bc = null;
  try { bc = new BroadcastChannel('masar-screen'); bc.onmessage = e => { if (e.data && e.data.f) onFrame(e.data.f); }; } catch (e) {}
  const hello = () => { try { if (bc) bc.postMessage({ hello: ID }); } catch (e) {} };
  hello(); setInterval(hello, 1000);
  // served by the ESP32 (or ?poll=1 / ?poll=http://host): poll its /f endpoint
  const pq = q.get('poll');
  const base = pq && pq !== '1' ? pq.replace(/\/$/, '') : '';
  const polling = pq !== null || (location.protocol === 'http:' && /^((\d{1,3}\.){3}\d{1,3}|.*\.local)$/.test(location.hostname) && location.hostname !== '127.0.0.1');
  if (polling) setInterval(async () => {
    try { const r = await fetch(base + '/f', { cache: 'no-store' }); const j = await r.json(); if (j.f && j.age >= 0) onFrame(j.f, performance.now() - j.age); } catch (e) {}
  }, 250);

  /* ---------- what to show ---------- */
  let st = 'wait', rel = '', shown = '', changeT = 0, amber = false;
  const WORDS = { U: ['كمّل للأمام', 'Go straight'], R: ['انعطف يميناً', 'Turn right'], L: ['انعطف يساراً', 'Turn left'], D: ['ارجع للخلف', 'Turn back'], X: ['مغلق، لا تمر', 'Closed, do not pass'], O: ['', ''] };
  const CHIP = { live: ['متصلة', 'Live'], stale: ['لا إشارة · المسار الافتراضي', 'No signal · default route'], wait: ['بانتظار لوحة التحكم', 'Waiting for the control panel'], nosuch: ['لا توجد شاشة بهذا الرقم', 'No screen with this number'] };
  function update() {
    const age = got ? performance.now() - got.at : Infinity;
    if (!got) { st = 'wait'; rel = ''; }
    else if (age > TIMEOUT) { st = 'stale'; rel = got.defaults[ID - 1] || 'U'; }
    else { rel = got.arrows[ID - 1] || ''; st = rel ? 'live' : 'nosuch'; }
    amber = st === 'stale';
    if (rel !== shown) { shown = rel; changeT = performance.now(); $('live').textContent = rel ? T(WORDS[rel][0], WORDS[rel][1]) : ''; }
    const c = $('chip'); if (c.dataset.s !== st) { c.dataset.s = st; c.textContent = T(CHIP[st][0], CHIP[st][1]); }
    const b = document.body; b.dataset.state = st; b.dataset.rel = rel; b.dataset.sid = ID;
  }
  setInterval(update, 100);

  /* ---------- the LED matrix ---------- */
  const COLS = 32, ROWS = 18, cv = $('cv'), g = cv.getContext('2d');
  let cell = 20, dpr = 1;
  function fit() {
    const vw = innerWidth, vh = innerHeight, m = Math.min(vw, vh), pad = m * 0.024;
    const w = Math.min(vw * 0.94 - 2 * pad, (vh * 0.84 - 2 * pad) * COLS / ROWS), h = w * ROWS / COLS;
    dpr = Math.min(2, devicePixelRatio || 1); cv.style.width = w + 'px'; cv.style.height = h + 'px';
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cell = cv.width / COLS;
  }
  addEventListener('resize', fit); fit();
  const ANG = { U: -Math.PI / 2, R: 0, D: Math.PI / 2, L: Math.PI };
  function lit(r, u, v, a) {
    if (r === 'X') return (Math.abs(u - v) < 0.25 || Math.abs(u + v) < 0.25) && Math.abs(u) < 0.9;
    const ca = Math.cos(-a), sa = Math.sin(-a), X = u * ca - v * sa, Y = u * sa + v * ca;
    return (X > -0.95 && X < 0.15 && Math.abs(Y) < 0.26) || (X >= 0.1 && X < 0.95 && Math.abs(Y) < (0.95 - X));
  }
  function draw(t) {
    g.clearRect(0, 0, cv.width, cv.height); g.fillStyle = '#050305'; g.fillRect(0, 0, cv.width, cv.height);
    const on = rel && rel !== 'O', a = ANG[rel] || 0, H = ROWS * cell, W = COLS * cell, sc = H / 2 - H * 0.07;
    const col = rel === 'X' ? '255,59,78' : amber ? '255,176,32' : '77,255,142';
    const fade = reduce ? 1 : Math.min(1, 0.15 + (t - changeT) / 220);
    const pts = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const px = (c + 0.5) * cell, py = (r + 0.5) * cell, u = (px - W / 2) / sc, v = (py - H / 2) / sc;
      if (on && lit(rel, u, v, a)) {
        const wave = reduce ? 1 : rel === 'X' ? (Math.sin(t / 1000 * 9) > 0 ? 1 : 0.5) : 0.7 + 0.3 * (Math.sin((u * Math.cos(a) + v * Math.sin(a)) * 3.2 - t / 1000 * 7) > -0.2 ? 1 : 0);
        pts.push([px, py, wave * fade]);
      } else { g.beginPath(); g.arc(px, py, cell * 0.36, 0, 7); g.fillStyle = '#151C17'; g.fill(); }
    }
    pts.forEach(([x, y, al]) => { g.beginPath(); g.arc(x, y, cell * 0.95, 0, 7); g.fillStyle = `rgba(${col},${0.1 * al})`; g.fill(); });
    pts.forEach(([x, y, al]) => { g.beginPath(); g.arc(x, y, cell * 0.4, 0, 7); g.fillStyle = `rgba(${col},${al})`; g.fill(); });
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  /* ---------- full screen, keep awake ---------- */
  const fsOK = document.fullscreenEnabled;
  const hint = $('hint'); if (fsOK) { hint.textContent = T('اضغط في أي مكان لملء الشاشة', 'Tap anywhere for full screen'); setTimeout(() => { hint.style.opacity = 0; }, 5000); }
  const toggleFs = () => { if (!fsOK) return; if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); };
  document.body.addEventListener('click', toggleFs);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') toggleFs(); });
  let lock = null; const keepAwake = async () => { try { if (navigator.wakeLock) lock = await navigator.wakeLock.request('screen'); } catch (e) {} };
  keepAwake(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  update();
})();
</script>
</body>
</html>
